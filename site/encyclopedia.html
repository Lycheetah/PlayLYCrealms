me. In a shared world the city is shared.","use":"Right click to ride the skytrain to Neon City.","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Gold Ingot","goldIngot"],[1,"Microchip","microchip"],[2,"Glass","glass"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"solarWing","n":"Solar Wing","f":"craft","t":"block","i":1195,"does":"A block. Breaks by hand.","use":"A craft part: a wing that also gives 6 thrust by day.","make":[{"n":2,"at":"at a Maker's Bench","in":[[2,"Wing","wing"],[2,"Silicon Wafer","siliconWafer"],[1,"Glass","glass"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"speedPad","n":"Speed Pad","f":"craft","t":"block","i":1196,"does":"It glows, and lights what is around it.","use":"Build it into the floor and step on it.","make":[{"n":2,"at":"at a Maker's Bench","in":[[2,"Stone Brick","stoneBrick"],[1,"Sulfur Dust","sulfurDust"],[1,"Copper Ingot","copperIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench).\nSometimes from the Leprechaun's Pot of Gold."},{"k":"wheelHelm","n":"Steering Wheel","f":"craft","t":"block","i":1197,"does":"A seat alone steers 16 parts. A Wooden Tiller 32, a Steering Wheel 96, a Control Board 200, an Aether Helm 400.","use":"Build it into a craft around a seat, stand by the seat and press F to set off. G docks the craft back into blocks; Recall craft (menu) calls it back to you.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Haft","haft"],[2,"Copper Ingot","copperIngot"],[1,"Wooden Gear","woodGear"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"tractorKit","n":"Tractor Kit","f":"craft","t":"item","i":1198,"does":"Hold it and right click on open ground: a Tractor is built. Right click its seat, Assemble and board, and drive. It burns Coal.","use":"","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Iron Ingot","ironIngot"],[2,"Brass Ingot","brassIngot"],[4,"Planks","planks"],[4,"Coal","coal"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"liftCrystal","n":"Vimana Crys  to place it. Break it again to pick it up.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Stone Brick","stoneBrick"],[2,"Iron Ingot","ironIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"arenaRibbon","n":"Arena Ribbon","f":"ranch","t":"item","i":1208,"does":"A great trophy: the Anvil asks for one for the last blow, the ★.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"carePen","n":"Care Pen","f":"ranch","t":"block","i":1209,"does":"Planks, logs and wheat. Right click it with a creature in your net to settle it in, then feed it what it eats (right click with the food) six times, twenty seconds or more apart. Then it grows.","use":"Place it, then right click it with a creature in your net. Feed the creature what it eats six times, twenty seconds or more apart, and it grows into a mount or a companion.","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Planks","planks"],[2,"Any log",""],[2,"Wheat","wheat"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"creatureNet","n":"Creature Net","f":"ranch","t":"item","i":1210,"does":"A Creature Net (two hafts, two wool). Get close to a small creature, a bird or a butterfly, aim, and right click. Your net holds four.","use":"Aim at a small creature, a bird or a butterfly up close and right click: it goes into your net (four at most).","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Haft","haft"],[2,"White Wool","wool"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"feather","n":"Feather","f":"ranch","t":"item","i":1211,"does":"A crafting material. It goes into 11 recipes, such as Arrow, Rubber Chicken, Explore Block, Wind Spirit Jar.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["arrow","rubberChicken","exploreBlock","windJar","cloudPearl","cloudHelm","cloudPlate","cloudLegs","cloudBoots","phoenixFeather","racingSaddle"],"get":"Dropped by Chicken, Puffling, Duck, Glass Heron, Chrome Pigeon."},{"k":"glassShell","n":"Glass Shell","f":"ranch","t":"item","i":1212,"does":"A crafting material. It goes into 1 recipe, such as Glass.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["glass"],"get":"Dropped by Glassback."},{"k":"racePost","n":"Race Post","f":"ranch","t":"block","i":1213,"does":"Right click a Race Post: it lays out eight glowing hoops in a loop, an air course if you start aboard something that flies. Beat the par for Bronze, Silver and Gold: Gold wins the Racing Cup.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[2,"White Wool","wool"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"raceCup","n":"Racing Cup","f":"ranch","t":"block","i":1214,"does":"In the menu. Each season is 7 days and its first day is a festival: the Bloom Fair (spring), the Sun Feast and its Fishing Derby (summer), the Harvest Moon (autumn) and the Frost Lights (winter). It keeps your race times, arena record and biggest fish.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"It grows wild on the land."},{"k":"ranchPost","n":"Ranch Post","f":"ranch","t":"block","i":1215,"does":"Bench: 6 planks, 2 hide, 2 hafts. Right click it to see every animal you keep in this realm: name, traits, generation and parents. Once a day your herd animals within 24 blocks leave their produce in it (wool, eggs, milk). Call the herd home brings them to the post, and there they stay.","use":"Place it and right click it to see your herd.","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Planks","planks"],[2,"Hide","hide"],[2,"Haft","haft"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"skitterSilk","n":"Skitter Silk","f":"ranch","t":"item","i":1216,"does":"A crafting material. It goes into 1 recipe, such as White Wool.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["wool"],"get":"Dropped by Skitterling."},{"k":"sporeDust","n":"Spore Dust","f":"ranch","t":"item","i":1217,"does":"A crafting material. It goes into 1 recipe, such as Smoke Bomb.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["smokeBomb"],"get":"Dropped by Gloomcap, Gloomstalker, Hexcaller."},{"k":"thornSpine","n":"Thorn Spine","f":"ranch","t":"item","i":1218,"does":"Thornbacks charge if you get close (their spines make arrows). Gloomcaps puff sleepy spores that slow you. Skitterlings swarm in the dark of caves. Bandits walk the roads by day and shoot from range. Strange gentle things live in the green lands too: Pufflings that float away when scared, Mosshogs with a tree on their back, and Glassbacks whose shells make glass.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["arrow"],"get":"Dropped by Hedgehog."},{"k":"bardStage","n":"Bard's Stage","f":"towns","t":"block","i":1219,"does":"A machine. Place it and it works: most need power, fuel, or something fed in. Right click it to see what it is doing.","use":"Place it. A bard lives by it; right click them for a song and a story.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[2,"White Wool","wool"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"claimStone","n":"Claim Stone","f":"towns","t":"block","i":1220,"does":"No monster rises within 32 blocks of it, so your keep is safe at night. Towns, ports and holds are safe the same way.","use":"Place it. Machines join the blocks around them: power along cables, items along belts and tubes, signals along signal wire. Right click it to see inside.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Dressed Stone","dressedStone"],[1,"Gold Ingot","goldIngot"],[2,"Copper Ingot","copperIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"guardPost","n":"Guard Post","f":"towns","t":"block","i":1221,"does":"Place a Guard Post, a Trader's Stall, a Farmer's Plot or a Bard's Stage anywhere in your kingdom and a townsperson comes to live by it. Guards shoot what hunts nearby. Traders trade. Farmers plant and reap the soil around their plot (talk to them for the harvest). Bards sing and tell the old stories. If one falls, another comes after a while.","use":"Place it in your kingdom. A guard lives by it and shoots what hunts nearby. If they fall, another comes after a while.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[2,"Iron Ingot","ironIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"knowledgeBoard","n":"Knowledge Board","f":"towns","t":"block","i":1222,"does":"Planks, a bookshelf and gold at a bench. Right click it: what your kingdom knows, and what kind of world this is.","use":"Place it in your home and right click it: what your kingdom has learned from the peoples of the world, and what kind of world this is.","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Planks","planks"],[1,"Bookshelf","bookshelf"],[1,"Gold Ingot","goldIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"lectern","n":"Lectern","f":"towns","t":"block","i":1223,"does":"Every world has its own history, written from its seed: the Aurum before, four ancient kingdoms, the Shattering and who is to blame, five heroes tied to real places in your world, and Your Chapter, written from what you have done. Read it at any lectern; the dwarven holds keep their own legends too.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[1,"Haft","haft"]]}],"used":["codexStand"],"get":"Craft it (at a Maker's Bench)."},{"k":"marketStall","n":"Market Stall","f":"towns","t":"block","i":1224,"does":"Six planks, three wool and a gold ingot at a bench. Place it and right click it. Tap things in your bag to put the whole stack on the stall; each gets a fair price to start (a little over its worth), which you can change with − and +, by typing it, or with Fair.","use":"Place it and right click it. Put things from your bag on the stall and set each price. Merchant caravans come by now and then and buy at your prices; the takings wait in the till for your tablet, or as gold. A stall near your Town Hall sees caravans more often.","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Planks","planks"],[3,"White Wool","wool"],[1,"Gold Ingot","goldIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"townHall","n":"Town Hall","f":"towns","t":"block","i":1225,"does":"A Town Hall founds a town 48 blocks across with you as mayor. Add members, take 10 gold at a time into the treasury, and the town rises to level 5, unlocking laws: members-only building, a watch that keeps monsters out at night, lamplighters, nightly fireworks, and the title of Capital.","use":"Place it to found a town. Right click it to run the town.","make":[{"n":1,"at":"at a Maker's Bench","in":[[12,"Stone Brick","stoneBrick"],[4,"Gold Ingot","goldIngot"],[2,"Iron Ingot","ironIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"tradePost","n":"Trade Post","f":"towns","t":"block","i":1226,"does":"Each Trade Post has a code. Load its hold, enter another post's code, and send a caravan: about 6 blocks a second on the road, or 2 minutes by the old rail between realms. If the sender is offline when it arrives, anyone in the world finishes the delivery.","use":"Place it. Machines join the blocks around them: power along cables, items along belts and tubes, signals along signal wire. Right click it to see inside.","make":[{"n":1,"at":"at a Maker's Bench","in":[[6,"Planks","planks"],[1,"Chest","chest"],[2,"Copper Ingot","copperIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"traderStall","n":"Trader's Stall","f":"towns","t":"block","i":1227,"does":"A machine. Place it and it works: most need power, fuel, or something fed in. Right click it to see what it is doing.","use":"Place it. A trader lives by it; right click them to trade.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[1,"Gold Ingot","goldIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"ascSigil","n":"Ascendant Sigil","f":"adv","t":"item","i":1228,"does":"Proof of an Ascension. Seven of them, one from every Guardian, tell your whole climb.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"bearClaw","n":"Bear Claw","f":"adv","t":"item","i":1229,"does":"Two, with a haft and cord, make a Claw Knife.","use":"","make":[],"used":["clawBlade"],"get":"Dropped by Bear."},{"k":"bellClapper","n":"Bell Clapper","f":"adv","t":"item","i":1230,"does":"Each realm's Guardian holds one colour of the Work, and its trophy is the colour: Azure (Mundus, the Drowned Bell), Black (Nigredo, the Ash Wyrm), White (Albedo, the Glass Leviathan), Red (Rubedo, the Lion-King), Green (Viriditas, the Thorn Queen), Yellow (Citrinitas, the Pharaoh Engine), Violet (Mortificatio, Titan Prime).","use":"A great trophy. The Anvil asks for one for the last blow, the ★.","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"campaignBlock","n":"Campaign Block","f":"adv","t":"block","i":1231,"does":"Level 1: two bronze gears, four copper, two glass and a lazurite at a bench. Place it and right click: it opens onto the Clockwork Reach, a brass city under a copper-gold sky. The Campaign Block on the arrival terrace brings you home. It is shared: bring a friend, and more guards come.","use":"Place it and right click it: Campaign Block 1 opens onto the Clockwork Reach (and the one on the Reach's terrace brings you home). Level 1: it takes gears to make. Bring a friend: it is shared, and more guards come.","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Bronze Gear","bronzeGear"],[4,"Copper Ingot","copperIngot"],[2,"Glass","glass"],[1,"Lazurite","lazurite"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"cartoTable","n":"Cartographer's Table","f":"adv","t":"block","i":1232,"does":"Planks, wool and iron. Make a map of where you stand, then click it to pin notes. Pins to compass turns them into ★ marks, and pins show as red dots on your world map (M).","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[1,"White Wool","wool"],[1,"Iron Ingot","ironIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"crownSeventh","n":"Crown of the Seventh","f":"adv","t":"item","i":1233,"does":"The first Seventh you beat leaves its crown: the best helm in the game.","use":"Forges to +8 at the Anvil. Open your bag (E) and click its slot in the Wear row to put it on.","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"delvePortal","n":"Delve Portal","f":"adv","t":"block","i":1234,"does":"It glows, and lights what is around it.","use":"Opens when a Delve's Warden falls. Right click it to go back up to the stair.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"gearHeart","n":"Gear Heart","f":"adv","t":"block","i":1235,"does":"The West and North Towers have stairs outside to a Gear Heart at the top. The Chime Tower is sealed by an oiled door: ring its three chimes in the right order (a panel says the day, then the night, then the stars). Coglings and Brass Sentinels guard every tower.","use":"Right click it to take the Gear Heart. Three wind the Mainspring.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"golemCore","n":"Golem Core","f":"adv","t":"item","i":1236,"does":"A crafting material. It goes into 1 recipe, such as Embersteel Ingot.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["embersteel"],"get":"Dropped by Ash Golem."},{"k":"guardianAltar","n":"Guardian Altar","f":"adv","t":"block","i":1237,"does":"Every realm has lairs: an arena of pillars around a Guardian Altar. Come close and the guardian rises: the Drowned Bell (deep under Mundus' sea), the Ash Wyrm, the Glass Leviathan, the Lion-King, the Thorn Queen, the Pharaoh Engine, Titan Prime. At half health they enrage and call their kin. Beaten, they leave their trophy by the altar.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"hollowHeart","n":"Hollow Heart","f":"adv","t":"item","i":1238,"does":"A night trophy. At a bench, with sulfur dust, it makes three Smoke Bombs.","use":"","make":[],"used":["smokeBomb"],"get":"Dropped by Hollow."},{"k":"homeCompass","n":"Home Compass","f":"adv","t":"item","i":1239,"does":"Hold it to see how far home is and which way. Right click to go home.","use":"","make":[{"n":1,"at":"at a Maker's Bench","in":[[1,"Lodestone","lodestone"],[2,"Copper Ingot","copperIngot"],[1,"Glass","glass"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"ivory","n":"Ivory","f":"adv","t":"item","i":1240,"does":"From mammoths. Ivory spears are the best of the wild.","use":"","make":[],"used":["lycheeClaws","ivoryInlay","ivorySpear","lycheeFang","bloodmoonReaper","lycheePulse","reaperHelm","reaperPlate","reaperLegs","reaperBoots"],"get":"Dropped by Mammoth."},{"k":"kingsMane","n":"King's Mane","f":"adv","t":"item","i":1241,"does":"A Guardian's trophy: dissolve it in a Great Athanor for a colour of the Work.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"leviathanGlass","n":"Leviathan Glass","f":"adv","t":"item","i":1242,"does":"A great trophy. The Anvil asks for one for the last blow, the ★.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"lionMane","n":"Lion Mane","f":"adv","t":"item","i":1243,"does":"A trophy of the hunt. Two, with a Beast Core, gold and cord, make a Hunter's Mark.","use":"","make":[],"used":["huntersMark"],"get":"Dropped by Lion."},{"k":"lootBag","n":"Loot Bag","f":"adv","t":"item","i":1244,"does":"What hunts you sometimes carries one, and a Fizzwick stopped in time drops one half the time. Right click to open.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":[],"get":"Dropped by Bandit, RaiderChief.\nFound in chests: ruins, towers, dungeons and wrecks.\nSometimes from the Leprechaun's Pot of Gold."},{"k":"chimeMoon","n":"Moon Chime","f":"adv","t":"block","i":1245,"does":"A block. Breaks fastest with a pick (Iron or better).","use":"Ring the chimes in the right order to open the oiled door.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"motherBlessing","n":"Mother's Blessing","f":"adv","t":"item","i":1246,"does":"Keep it in your bag: it slowly heals you, all the time.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"oilDoor","n":"Oiled Door","f":"adv","t":"block","i":1247,"does":"A block. Breaks fastest with a pick (Iron or better).","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"oreFinder","n":"Ore Finder","f":"adv","t":"item","i":1248,"does":"Right click: it names the best ore within 16 blocks and shows a beam to it.","use":"","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Copper Ingot","copperIngot"],[1,"Iron Ingot","ironIngot"],[1,"Glass","glass"]]}],"used":[],"get":"Craft it (at a Maker's Bench).\nSometimes from the Leprechaun's Pot of Gold."},{"k":"pharaohMask","n":"Pharaoh Mask","f":"adv","t":"item","i":1249,"does":"A great trophy. The Anvil asks for one for the last blow, the ★.","use":"","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"raiderTotem","n":"Raider Totem","f":"adv","t":"block","i":1250,"does":"Snapclaw packs hunt the forests by day. Raider camps stand in the wild far from towns: tents, a totem, a chest of loot, raiders, archers and a chief who wears a mask. Break the totem to scatter them. Bonewalkers walk at night; stonejaws and gloomstalkers wait in the caves.","use":"The heart of a raider camp. Break it and the raiders scatter.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"riftBrick","n":"Rift Brick","f":"adv","t":"block","i":1251,"does":"Fight rooms wake when you walk in. Trap rooms have spikes in the floor: they hurt, but they never kill. Treasure rooms have a chest. Shrines are quiet, and mend you while you stand in them. The glowing gate in the first room takes you home at any time.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"riftDoor","n":"Rift Door","f":"adv","t":"block","i":1252,"does":"One room's chest holds the Rift Key. The corridor into the Keeper's hall is barred by a Rift Door: right click it with the key in your bag.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"riftKey","n":"Rift Key","f":"adv","t":"item","i":1253,"does":"A material: see how to get it below.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":[],"get":"Look in chests, on traders and in the realms where it belongs."},{"k":"riftSpikes","n":"Rift Spikes","f":"adv","t":"block","i":1254,"does":"A plant. It grows wild, and breaks in one blow.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"It grows wild on the land."},{"k":"riftStone","n":"Rift Stone","f":"adv","t":"item","i":1255,"does":"Bench: 2 obsidian, a geode crystal and 2 gold. Right click it in any of the seven realms to tear open a Rift: a maze of stone rooms made fresh for that run, and gone after.","use":"Right click to step into the Rift.","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Obsidian","obsidian"],[1,"Geode Crystal","geodeCrystal"],[2,"Gold Ingot","goldIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"riftWall","n":"Rift Wall","f":"adv","t":"block","i":1256,"does":"A block. Breaks by hand.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"scrapBox","n":"Scrap Box","f":"adv","t":"item","i":1257,"does":"A material: see how to get it below.","use":"Mostly used in crafting: it appears in the recipes below.","make":[{"n":1,"at":"by hand","in":[[9,"Scrap","scrap"]]}],"used":[],"get":"Craft it (by hand)."},{"k":"seaPass","n":"Sea Pass","f":"adv","t":"item","i":1258,"does":"A stamped brass-and-canvas pass. With it in your bag, every ferry between ports you know is free. Right click it to open the ferry list.","use":"","make":[{"n":1,"at":"at a Maker's Bench","in":[[4,"Planks","planks"],[2,"Gold Ingot","goldIngot"],[2,"Cord","cord"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"sealedDoor","n":"Sealed Door","f":"adv","t":"block","i":1259,"does":"A shrine of castle stone with a sealed door in its floor, over a chamber of Sealed Stone that nothing breaks. Right click the door with a Vault Key: it opens, a rope ladder hangs down, and the treasure is yours: gold, pressed diamonds, quintessence, and a piece of fine gear.","use":"The door of a Sealed Vault. Nothing breaks it; a Vault Key opens it.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"sealedStone","n":"Sealed Stone","f":"adv","t":"block","i":1260,"does":"A block. Breaks by hand.","use":"The stone of a Sealed Vault. Nothing breaks it.","make":[],"used":[],"get":"Found in the world: the land, the caves, or a realm of its own."},{"k":"serpentScale","n":"Serpent Scale","f":"adv","t":"item","i":1261,"does":"In deep water in Mundus, Rubedo and Viriditas, a Sea Serpent sometimes rises when you are out on the water. Its scales make Scale Hull.","use":"Mostly used in crafting: it appears in the recipes below.","make":[],"used":["scaleHull"],"get":"Dropped by Serpent."},{"k":"skyAltar","n":"Sky Altar","f":"adv","t":"block","i":1262,"does":"It glows, and lights what is around it.","use":"Hold it and right click on a surface to place it. Break it again to pick it up.","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Rune Stone","runeStone"],[3,"Gold Ingot","goldIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench)."},{"k":"spyglass","n":"Spyglass","f":"adv","t":"item","i":1263,"does":"Spyglass: right click to zoom (×3, ×7, off) and name what you see. Pocket Workshop: keep it in your bag and you always have a bench and a kiln. Ore Finder: the best ore within 16 blocks, with a beam to it. Weather Rod: call a storm or break one. Lantern Launcher: fires Ember Lanterns from your bag onto walls. Boomerang: it comes back. Smoke Bomb: throw it and nothing can see you. Bear Trap: catches anything that steps on it; right click a sprung one to set it again.","use":"Right click to zoom: ×3, then ×7, then off. It names what you look at.","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Glass","glass"],[2,"Copper Ingot","copperIngot"]]}],"used":[],"get":"Craft it (at a Maker's Bench).\nSometimes from the Leprechaun's Pot of Gold."},{"k":"starChart","n":"Star Chart","f":"adv","t":"item","i":1264,"does":"Right click to read it: three far places worth seeing become waypoints on your map and compass.","use":"","make":[{"n":1,"at":"at a Maker's Bench","in":[[2,"Glass","glass"],[1,"Starmetal","sta
